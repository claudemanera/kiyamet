name: Build Kiyamet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolor power stones from the vanilla amethyst shard
        run: |
          pip install pillow
          VURL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.11") | .url')
          CURL=$(curl -s "$VURL" | jq -r '.downloads.client.url')
          curl -sL -o client.jar "$CURL"
          python3 tools/recolor_stones.py client.jar
          rm client.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          cp build.log /tmp/build.log
          git checkout --orphan ci-log
          git rm -rfq .
          cp /tmp/build.log build.log
          git add build.log && git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kiyamet build ${{ github.run_number }}
          make_latest: true
          files: build/libs/kiyamet-*[0-9].jar
      - uses: actions/upload-artifact@v4
        with:
          name: kiyamet-jar
          path: build/libs/kiyamet-*[0-9].jar
