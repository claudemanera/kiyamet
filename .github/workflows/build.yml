name: Build Kiyamet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolor power stones from the vanilla amethyst shard
        run: |
          pip install pillow
          VURL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.11") | .url')
          CURL=$(curl -s "$VURL" | jq -r '.downloads.client.url')
          curl -sL -o client.jar "$CURL"
          python3 tools/make_flat_preset.py client.jar
          rm client.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: API reference dump
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/ref
          MC=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-common-1.21.11*.jar' | grep -v intermediary | grep -v sources | head -1)
          MCC=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-clientonly-1.21.11*.jar' | grep -v intermediary | grep -v sources | head -1)
          GL=$(find ~/.gradle/caches -name 'geckolib*.jar' | grep -v sources | head -1)
          echo "MC=$MC MCC=$MCC GL=$GL" > /tmp/ref/paths.txt
          unzip -l "$GL" | grep '\.class' | awk '{print $4}' > /tmp/ref/geckolib_classes.txt
          unzip -l "$MC" | awk '{print $4}' | grep '\.class' > /tmp/ref/mc_classes.txt
          unzip -l "$MCC" | awk '{print $4}' | grep '\.class' > /tmp/ref/mc_client_classes.txt
          CP="$MC:$MCC:$GL:$(find ~/.gradle/caches -name '*.jar' -path '*fabric*' | grep -v sources | tr '\n' ':')"
          while read c; do [ -n "$c" ] && javap -public -constants -cp "$CP" "$c" > "/tmp/ref/$c.txt" 2>&1; done < tools/javap_classes.txt
          for k in software.bernie.geckolib.model.DefaultedGeoModel software.bernie.geckolib.model.DefaultedEntityGeoModel software.bernie.geckolib.cache.GeckoLibResources software.bernie.geckolib.constant.DefaultAnimations; do echo "== $k"; javap -c -p -cp "$CP" $k 2>&1 | grep -E "ldc|String"; done > /tmp/ref/geomodel_strings.txt
          if [ -f tools/javap_private.txt ]; then while read c; do [ -n "$c" ] && javap -p -cp "$CP" "$c" > "/tmp/ref/p_$c.txt" 2>&1; done < tools/javap_private.txt; fi
          true
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          cp build.log /tmp/build.log
          git checkout --orphan ci-log
          git rm -rfq .
          cp /tmp/build.log build.log
          git add build.log && git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: Publish API reference
        if: always()
        continue-on-error: true
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          cp build.log /tmp/ref/build.log 2>/dev/null || true
          git stash -u -q || true
          git checkout -q --orphan ci-ref
          git rm -rfq . || true
          cp -r /tmp/ref/* .
          git add -A && git commit -qm "ref ${{ github.run_number }}" && git push -qf origin ci-ref
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kiyamet build ${{ github.run_number }}
          make_latest: true
          files: build/libs/the-walking-dead-*[0-9].jar
      - uses: actions/upload-artifact@v4
        with:
          name: kiyamet-jar
          path: build/libs/the-walking-dead-*[0-9].jar
