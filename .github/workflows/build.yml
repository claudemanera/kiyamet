name: Build Kiyamet
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolor power stones from the vanilla amethyst shard
        run: |
          pip install pillow
          VURL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.11") | .url')
          CURL=$(curl -s "$VURL" | jq -r '.downloads.client.url')
          curl -sL -o client.jar "$CURL"
          python3 tools/recolor_stones.py client.jar
          rm client.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kiyamet-jar
          path: build/libs/kiyamet-*[0-9].jar
