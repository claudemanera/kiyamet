name: Build Modrinth profile (.mrpack)
# Makes "TWD MOD": a Modrinth App profile with Fabric 1.21.11, Fabric API, GeckoLib, Sodium, Lithium and the TWD jar,
# and attaches it to the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.2.2"
        required: true
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build the profile
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}" }
        run: |
          set -e
          gh release download "$TAG" --pattern "*.jar" --dir jar
          mkdir -p pack/overrides/mods && cp jar/*.jar pack/overrides/mods/
          python3 - "$TAG" <<'PY'
          import json, sys, urllib.request, urllib.parse
          tag = sys.argv[1]
          UA = {"User-Agent": "claudemanera/kiyamet (github actions)"}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA)))
          files = []
          for slug in ("fabric-api", "geckolib", "sodium", "lithium"):
              q = urllib.parse.urlencode({"game_versions": '["1.21.11"]', "loaders": '["fabric"]'})
              vs = [v for v in get(f"https://api.modrinth.com/v2/project/{slug}/version?{q}") if v["version_type"] == "release"] or get(f"https://api.modrinth.com/v2/project/{slug}/version?{q}")
              f = next(x for x in vs[0]["files"] if x["primary"]) if any(x["primary"] for x in vs[0]["files"]) else vs[0]["files"][0]
              files.append({"path": "mods/" + f["filename"], "hashes": {"sha1": f["hashes"]["sha1"], "sha512": f["hashes"]["sha512"]},
                            "env": {"client": "required", "server": "required"}, "downloads": [f["url"]], "fileSize": f["size"]})
              print(slug, vs[0]["version_number"])
          loader = get("https://meta.fabricmc.net/v2/versions/loader/1.21.11")[0]["loader"]["version"]
          print("fabric-loader", loader)
          json.dump({"formatVersion": 1, "game": "minecraft", "versionId": tag.lstrip("v"), "name": "TWD MOD",
                     "summary": "The Walking Dead - zombie apocalypse survival", "files": files,
                     "dependencies": {"minecraft": "1.21.11", "fabric-loader": loader}}, open("pack/modrinth.index.json", "w"), indent=1)
          PY
          cd pack && zip -qr "../TWD-MOD-${TAG#v}.mrpack" . && cd ..
          gh release upload "$TAG" "TWD-MOD-${TAG#v}.mrpack" --clobber
