name: Smoke test (real server)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated assets
        run: |
          pip install pillow
          VURL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.11") | .url')
          CURL=$(curl -s "$VURL" | jq -r '.downloads.client.url')
          curl -sL -o client.jar "$CURL"
          python3 tools/make_flat_preset.py client.jar
          rm client.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --stacktrace
      - name: Set up server
        run: |
          mkdir -p srv/mods && cd srv
          INST=$(curl -s https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
          curl -sL -o fabric-server-launch.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/$(grep loader_version ../gradle.properties | cut -d= -f2)/$INST/server/jar"
          FAPI=$(grep fabric_api_version ../gradle.properties | cut -d= -f2)
          curl -sL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
          cp "$(find ~/.gradle/caches -name 'geckolib-fabric-1.21.11-*.jar' | grep -v sources | head -1)" mods/
          cp ../build/libs/kiyamet-*[0-9].jar mods/
          ls -la mods
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-seed=12345\nview-distance=6\nsimulation-distance=6\nspawn-protection=0\nsync-chunk-writes=false\nmax-tick-time=-1\n" > server.properties
      - name: Run smoke test
        run: |
          cd srv
          python3 ../tools/smoke.py ../tools/smoke_entities.txt ../tools/smoke_structures.txt
      - name: Publish report
        if: always()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/out && cp srv/smoke.log srv/smoke_report.txt /tmp/out/ 2>/dev/null || true
          cp srv/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          cp -r srv/crash-reports /tmp/out/ 2>/dev/null || true
          git checkout -q --orphan smoke-report
          git rm -rfq . || true
          cp -r /tmp/out/* .
          git add -A && git commit -qm "smoke ${{ github.run_number }}" && git push -qf origin smoke-report
